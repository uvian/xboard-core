Log:
  Level: info

# 单机单节点模式
Node:
  ApiHost: https://panel.example.com
  NodeID: 1
  ApiKey: "<server_token>"
  Timeout: 15
  Retry: 3
  PullEvery: 60

# 机器模式（一台机器带多个节点）：把 Node 段留空，启用这一段
Machine:
  Enabled: false
  ApiHost: https://panel.example.com
  MachineID: 1
  Token: "<server_token>"
  NodeIDs: [1, 2, 3]

API:
  Listen: 127.0.0.1:8090   # 只监听本机；对外抓取请走反代 + 鉴权
  Metrics: true

Kernel:
  Xray: true       # vless/vmess/trojan/ss2022 + REALITY + xhttp
  Singbox: false   # anytls/tuic/hysteria2（M1 接入）
# 面板 ws_url 用自签证书时才需要（默认 false：配置下发链路里带 token，别全局放开校验）
# Node: { WsInsecure: false }
# sing-box 内核（anytls / tuic / hysteria2）走子进程，不走库：
# Kernel:
#   Xray: true
#   Singbox: true
#   SingboxBinary: sing-box
#   SingboxDir: run/singbox

